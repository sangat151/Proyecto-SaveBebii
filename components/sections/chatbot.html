<button class="chatbot-launcher" id="chatbotLauncher" type="button" aria-expanded="false">🐾 ¿Te ayudo?</button>
<section class="chatbot-window" id="chatbotWindow" aria-label="Chat de SaveBebi">
  <div class="chatbot-head"><div><strong>Asistente SaveBebi</strong><div style="font-size:12px;opacity:.9">Productos y ayuda animal</div></div><button id="chatbotClose" type="button" aria-label="Cerrar chat">×</button></div>
  <div class="chatbot-messages" id="chatbotMessages" aria-live="polite"><div class="chat-msg bot">¡Hola! 🐶 Soy el asistente de SaveBebi. Pregúntame por nuestros productos o por nuestra misión de ayudar a los perritos en situación de calle.</div></div>
  <form class="chatbot-form" id="chatbotForm"><input id="chatbotInput" maxlength="500" placeholder="Escribe tu pregunta..." autocomplete="off" required><button type="submit">Enviar</button></form>
</section>
