<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Huellas con Amor</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <!-- CSS del Login -->
    <link rel="stylesheet" href="../../../css/login.css">
</head>
<body class="login-page">

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="login-logo">
                <i class="fas fa-paw"></i>
                Huellas <span>con Amor</span>
            </div>

            <h2>Bienvenido de nuevo</h2>
            <p>Ingresa a tu cuenta para continuar</p>

            <form action="/login" method="post">
                
                <div class="form-group">
                    <label for="uname">Usuario</label>
                    <input type="text" id="uname" name="uname" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="psw">Contraseña</label>
                    <input type="password" id="psw" name="psw" placeholder="Ingresa tu contraseña" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Recuérdame</span>
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login">Iniciar Sesión</button>
                
            </form>

        </div>
    </div>

</body>
</html>
