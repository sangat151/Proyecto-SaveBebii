
name: Publicar SaveBebi en GitHub Page

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-react/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: admin-react

      - name: Compilar React
        run: npm run build
        working-directory: admin-react

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-react/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4

