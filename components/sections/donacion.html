<!-- Formulario para registrar aportes solidarios de la comunidad. -->
<section class="donacion-section" id="donacion">
  <div class="container donation-layout">
    <div class="donation-intro">
      <span class="section-eyebrow"><i class="fas fa-heart"></i> Súmate a la causa</span>
      <h2>Tu ayuda puede <span>hacer la diferencia</span></h2>
      <p>Registra tu intención de apoyar a SaveBebi. Puedes aportar tapitas, alimento o tu tiempo como voluntario.</p>
    </div>
    <form id="donationForm" class="donation-form">
      <h3>Registrar mi aporte</h3>
      <label for="donorName">Tu nombre</label>
      <input id="donorName" name="name" type="text" placeholder="¿Cómo te llamas?" minlength="2" maxlength="70" required>
      <label for="donorContact">Correo o teléfono (opcional)</label>
      <input id="donorContact" name="contact" type="text" placeholder="Para poder contactarte" maxlength="100">
      <label for="donationType">¿Cómo deseas ayudar?</label>
      <select id="donationType" name="type" required>
        <option value="">Selecciona un aporte</option>
        <option value="Tapitas plásticas">Tapitas plásticas</option>
        <option value="Alimento para animales">Alimento para animales</option>
        <option value="Voluntariado">Tiempo como voluntario/a</option>
        <option value="Aporte económico (intención)">Aporte económico (solo intención)</option>
      </select>
      <label for="donationDetail">Cantidad o detalle</label>
      <input id="donationDetail" name="detail" type="text" placeholder="Ej. 100 tapitas, una bolsa de alimento..." maxlength="140" required>
      <button class="donation-submit" type="submit"><i class="fas fa-hand-holding-heart"></i> Registrar mi aporte</button>
      <p id="donationFeedback" class="donation-feedback" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
